name: attach-assets
on:
  push:
    paths:
      - .github/workflows/_attach_assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: https://ancient-raleigh-nose-motion.trycloudflare.com/dist
    steps:
      - name: Upload release assets
        run: |
          set -e
          for tag in KeycardDetector-v3.2.0 KillFeed-v3.3.0 ResourceGatherMultiplier-v4.5.0 StackMultiplier-v5.2.0 TeleportSystem-v3.9.0; do
            file="${tag%%-v*}"
            name="$tag.zip"
            name="${file}-${tag#*-v}.zip"
            echo "$tag -> $name"
            curl -fsSL "$BASE_URL/$name" -o "/tmp/$name"
            ls -l "/tmp/$name"
            gh release upload "$tag" "/tmp/$name" --repo "$GITHUB_REPOSITORY" --clobber
          done
