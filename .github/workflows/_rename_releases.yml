name: rename-release-titles
on:
  push:
    paths:
      - '.github/workflows/_rename_releases.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename titles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit KeycardDetector-v3.2.0 --repo louxiaole/RustPlugins --title "KeycardDetector v3.2.0"
          gh release edit KillFeed-v3.3.0 --repo louxiaole/RustPlugins --title "KillFeed v3.3.0"
          gh release edit ResourceGatherMultiplier-v4.5.0 --repo louxiaole/RustPlugins --title "ResourceGatherMultiplier v4.5.0"
          gh release edit StackMultiplier-v5.2.0 --repo louxiaole/RustPlugins --title "StackMultiplier v5.2.0"
          gh release edit TeleportSystem-v3.9.0 --repo louxiaole/RustPlugins --title "TeleportSystem v3.9.0"
