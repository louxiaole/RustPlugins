name: set-notes
on:
  push:
    paths:
      - .github/workflows/_set_notes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set release notes
        run: |
          set -e
          gh release edit "KeycardDetector-v3.2.0" --repo "$GITHUB_REPOSITORY" --notes "检测附近的绿卡、蓝卡、红卡，并显示方向和位置（适配最新 Rust）"
          gh release edit "KillFeed-v3.3.0" --repo "$GITHUB_REPOSITORY" --notes "显示玩家击杀提示，包括击杀者、被击杀者、武器等信息（适配最新 Rust）"
          gh release edit "ResourceGatherMultiplier-v4.5.0" --repo "$GITHUB_REPOSITORY" --notes "资源采集倍率与战利品倍率，Carbon / Oxide 双框架兼容（适配最新 Rust）"
          gh release edit "StackMultiplier-v5.2.0" --repo "$GITHUB_REPOSITORY" --notes "物品堆叠倍率，支持聊天命令实时调整（适配最新 Rust）"
          gh release edit "TeleportSystem-v3.9.0" --repo "$GITHUB_REPOSITORY" --notes "传送点管理、防卡死、载具同步、地形加载等待（适配最新 Rust）"
