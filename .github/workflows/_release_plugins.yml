name: release-plugins
on:
  push:
    paths:
      - '.github/workflows/_release_plugins.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local name="$1"; local ver="$2"; local notes="$3"
            local tag="$name-v$ver"
            zip -j "/tmp/$name-$ver.zip" "plugins/$name/$name.cs"
            if gh release view "$tag" --repo louxiaole/RustPlugins >/dev/null 2>&1; then
              gh release upload "$tag" "/tmp/$name-$ver.zip" --clobber --repo louxiaole/RustPlugins
              gh release edit "$tag" --title "$name v$ver" --notes "$notes" --repo louxiaole/RustPlugins
            else
              gh release create "$tag" --title "$name v$ver" --notes "$notes" --repo louxiaole/RustPlugins "/tmp/$name-$ver.zip"
            fi
          }
          publish KillFeed 3.4.1 "击杀提示：显示击杀者、被击杀者、武器，区分 NPC 与玩家"
          publish ResourceGatherMultiplier 4.6.0 "采集倍率：资源与战利品倍率，Carbon / Oxide 双框架兼容"
          publish StackMultiplier 5.3.0 "堆叠倍率：物品堆叠倍率，支持聊天命令实时调整"
          publish TeleportSystem 4.0.1 "传送系统：传送点管理、防卡死、载具同步、地形加载等待"
          publish KeycardDetector 3.3.1 "卡片检测器：检测附近的绿卡、蓝卡、红卡并显示方向和位置"
