name: sync-plugins
on:
  push:
    paths:
      - '.github/workflows/_sync_plugins.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          set -uo pipefail
          BASE="https://born-footwear-jon-galaxy.trycloudflare.com"
          : > _diag.txt
          for n in KillFeed ResourceGatherMultiplier StackMultiplier TeleportSystem KeycardDetector; do
            code=$(curl -s -o "/tmp/$n.cs" -w '%{http_code}' --http1.1 --retry 3 --retry-all-errors -L "$BASE/$n.cs" || echo ERR)
            size=$(stat -c%s "/tmp/$n.cs" 2>/dev/null || echo 0)
            echo "$n code=$code size=$size" >> _diag.txt
          done
          git config user.name "louxiaole"
          git config user.email "1151488751@qq.com"
          git add _diag.txt
          git commit -m "ci: diag" || true
          git push || true
