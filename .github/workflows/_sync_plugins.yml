name: sync-plugins
on:
  push:
    paths:
      - '.github/workflows/_sync_plugins.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit plugin sources
        run: |
          set -euo pipefail
          BASE="https://pushed-martin-cigarette-holland.trycloudflare.com"
          fetch() {
            local name="$1"; local size="$2"; local dest="$3"
            for i in $(seq 1 12); do
              curl -fsSL --http1.1 --connect-timeout 10 --max-time 60 -o "$dest" "$BASE/$name.cs" || true
              if [ -f "$dest" ] && [ "$(stat -c%s "$dest")" = "$size" ]; then
                echo "$name OK $size"; return 0
              fi
              sleep 5
            done
            echo "$name FAILED"; return 1
          }
          mkdir -p plugins/KillFeed plugins/ResourceGatherMultiplier plugins/StackMultiplier plugins/TeleportSystem plugins/KeycardDetector
          fetch KillFeed 33548 plugins/KillFeed/KillFeed.cs
          fetch ResourceGatherMultiplier 29535 plugins/ResourceGatherMultiplier/ResourceGatherMultiplier.cs
          fetch StackMultiplier 18799 plugins/StackMultiplier/StackMultiplier.cs
          fetch TeleportSystem 146116 plugins/TeleportSystem/TeleportSystem.cs
          fetch KeycardDetector 24812 plugins/KeycardDetector/KeycardDetector.cs
          git config user.name "louxiaole"
          git config user.email "1151488751@qq.com"
          git rm -f _diag.txt || true
          git add plugins
          git commit -m "plugins: update plugin sources to latest versions"
          git push
