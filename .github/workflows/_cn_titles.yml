name: cn-titles
on:
  push:
    paths:
      - .github/workflows/_cn_titles.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Rename releases to Chinese titles
        run: |
          set -e
          gh release edit "ResourceGatherMultiplier-v4.5.0" --repo "$GITHUB_REPOSITORY" --title "采集倍率 v4.5.0"
          gh release edit "StackMultiplier-v5.2.0" --repo "$GITHUB_REPOSITORY" --title "堆叠倍率 v5.2.0"
